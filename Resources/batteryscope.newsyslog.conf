# batteryscope.newsyslog.conf — rotate the daemon log so a root process that
# runs forever does not fill the disk over months of uptime.
#
# Installed by install-daemon.sh to /etc/newsyslog.d/batteryscope.conf, where
# the system's newsyslog (run hourly by launchd, see
# /System/Library/LaunchDaemons/com.apple.newsyslog.plist) picks it up
# automatically — no daemon restart or extra service required.
#
# No pid_file/signal is given (the N flag), because daemon.log is a plain
# launchd StandardOutPath/StandardErrorPath file, not something fed by
# syslogd — there is no process to notify the way syslog-based rotation
# expects. That has one consequence worth knowing: the daemon keeps its file
# handle open across a rotation and goes on appending to the now-renamed
# file until it is next restarted, so the freshly-rotated daemon.log stays
# empty until then. Force it immediately with:
#   sudo launchctl kickstart -k system/com.batteryscope.daemon
#
# logfilename                             [owner:group] mode count size(KB) when flags
/Library/Logs/BatteryScope/daemon.log     root:wheel    644  5     10240    *     NJ
